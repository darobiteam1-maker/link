<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Estetik</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    overflow:hidden;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:40px;
    width:90%;
    max-width:700px;
    text-align:center;
    color:white;
    box-shadow:0 0 30px rgba(255,255,255,0.1);
}

h1{
    margin-bottom:25px;
    font-size:2rem;
    letter-spacing:2px;
    
}

.countdown{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.box{
    width:120px;
    height:120px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation:glow 3s infinite alternate;
}

.number{
    font-size:2.5rem;
    font-weight:bold;
}

.label{
    margin-top:5px;
    opacity:0.8;
}

@keyframes glow{
    from{
        box-shadow:0 0 10px rgba(255,255,255,0.1);
    }
    to{
        box-shadow:0 0 25px rgba(255,255,255,0.3);
    }
}

#finish{
    font-size:2rem;
    font-weight:bold;
    display:none;
}

@media(max-width:600px){
    .box{
        width:90px;
        height:90px;
    }

    .number{
        font-size:2rem;
    }
}

#gambar{
    width:80%;
    max-width:350px;
    height:auto;
    display:block;
    margin:20px auto;
    border-radius:15px;
    opacity:0;
    transition:1s;
}
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    animation:fall linear forwards;
    z-index:9999;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>
<body>

<div class="card">
    <h1 id="judul"> ENTENI BAE </h1>

    <div class="countdown" id="countdown">
        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Hari</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Jam</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Menit</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Detik</div>
        </div>
    </div>
    
    <div id="loading" style="display:none;">
    <h2>🎁 Mempersiapkan kejutan...</h2>
    <p>Tunggu sebentar ya</p>
</div>
    

<img id="gambar"
     src="https://darobiteam1-maker.github.io/Belajar/IMG-20260607-WA0043.jpg"
     style="display:none; width:300px; border-radius:15px">

    <div id="finish">
         SELAMAT ULANG TAHUN 
    </div>
</div>
<audio id="musik" preload="auto">
    <source src="rekaman1.mp3" type="audio/mpeg">
</audio>

<script>
// Ganti tanggal target di sini
const targetDate = new Date("2026-07-17 06:00:00").getTime();

const timer = setInterval(() => {

    const now = new Date().getTime();
    const distance = targetDate - now;

if (distance <= 0) {
    clearInterval(timer);

    document.getElementById("judul").style.display = "none";
    document.getElementById("countdown").style.display = "none";

    // Tampilkan loading
    document.getElementById("loading").style.display = "block";

    // Setelah 5 detik baru tampilkan hasil
    setTimeout(() => {
        document.getElementById("loading").style.display = "none";

        document.getElementById("finish").style.display = "block";
        document.getElementById("gambar").style.display = "block";
        

        createConfetti();
        
        <audio id="musik" preload="auto">
    <source src="happy.mp3" type="audio/mpeg"></audio>
        setTimeout(() => {
            document.getElementById("gambar").style.opacity = "1";
        }, 100);

    }, 10000);
}
    

    const days = Math.floor(distance / (1000*60*60*24));
    const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((distance % (1000*60)) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;

}, 1000);

function createConfetti() {
    const colors = [
        "#ff4d6d",
        "#ffd60a",
        "#38bdf8",
        "#4ade80",
        "#c084fc",
        "#ffffff"
    ];

    for(let i = 0; i < 150; i++){
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
            Math.random() * 10 + 5 + "px";

        confetti.style.height =
            confetti.style.width;

        confetti.style.animationDuration =
            Math.random() * 3 + 2 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5000);
    }
}



</script>

</body>
</html>
